include: package:pro_lints/recommended.yaml

# The root's own files are its tool/ and test/ (the checks, the benchmark,
# the end to end tools and their tests); `dart analyze` here covers every
# member of the workspace too, each under its own analysis_options.yaml.
analyzer:
  exclude:
    # packages of their own, no members of the workspace, each analyzed by
    # itself (xtask.yaml's pkg-analyze): here they would be context roots
    # of this analysis too, whose plugin snapshot two servers would build
    # at once
    - packages/twk_dev/templates/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # every public member documented: doc/internals/quality/README.md
    public_member_api_docs: true

# twk_lints, the repository's analyzer plugin: no test waits on the wall
# clock (doc/internals/quality/README.md, "Time in tests"). In the pub
# workspace this is the `plugins:` that loads it, for the root and every
# member alike; a member's own `plugins:` says which of its diagnostics
# are on for that member's files.
plugins:
  twk_lints:
    path: packages/twk_lints
    diagnostics:
      wall_time_in_tests: true
