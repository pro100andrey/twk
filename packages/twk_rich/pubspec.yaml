  Rich text for twk widgets: Markdown, syntax highlighting, diffs, JSON
  trees, big text and QR codes.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
resolution: workspace
dependencies:
  twk:
    path: ../twk
  twk_core:
    path: ../twk_core
dev_dependencies:
  pro_lints: ^6.2.0
  test: ^1.33.0
  twk_test:
    path: ../twk_test
