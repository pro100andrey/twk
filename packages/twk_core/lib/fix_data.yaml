# Data-driven fixes for twk_core: what `dart fix --apply` (and the IDE's
# quick fixes) change in an app written against an older twk_core.
#
# The format: https://dart.dev/go/data-driven-fixes (version 1). Newest
# first, each with the commit that made the change. Every transform is
# tested by a case in test_fixes/, checked by
# `dart fix --compare-to-golden test_fixes` in this package.
#
# A package rename (tui_core to twk_core, 826735a) is not here: a fix runs
# on a diagnostic of a library that resolves, and an import of a package
# the app no longer depends on resolves to nothing. The imports are moved
# by hand first (doc/internals/quality/README.md, "Renames and moves"),
# then this file renames what they import.
#
# Left by a rename, and changed by hand after it: the name in a `show` or
# `hide` combinator (undefined_shown_name) and in a type test, `o is
# TuiApp` (type_test_with_undefined_name), which no data-driven fix
# answers. test_fixes/ holds both as they are left, so that an SDK that
# starts fixing them fails the compare and the case is updated.

version: 1
transforms:
  # 6d4f947 Rename the API's tui names to twk
  - title: "Rename to 'TwkApp'"
    date: 2026-10-22
    element:
      uris: ['twk_core.dart']
      class: 'TuiApp'
    changes:
      - kind: 'rename'
        newName: 'TwkApp'
