name: twk
description: >-
  Flutter's widget model for terminal UIs in Dart: layout, text, focus,
  the mouse, scrolling, editing, overlays, navigation and animation.
version: 0.1.0
repository: https://github.com/pro100andrey/twk/tree/main/packages/twk
issue_tracker: https://github.com/pro100andrey/twk/issues
topics: [terminal, tui, cli, widgets, console]
screenshots:
  - description: The twk gallery's Table page, in the dark theme.
    path: doc/screenshots/table-dark.png
  - description: The Text page of the gallery, its options beside it, in the light theme.
    path: doc/screenshots/text-light.png
  - description: A dialog over the gallery's Dialog page, the rest dimmed behind a barrier.
    path: doc/screenshots/dialog-dark.png
  - description: The command palette, its matches highlighted, over the gallery.
    path: doc/screenshots/palette-dark.png

environment:
  sdk: ^3.13.5
resolution: workspace
dependencies:
  meta: ^1.19.0
  stack_trace: ^1.12.2
  twk_core: ^0.1.0
dev_dependencies:
  pro_lints: ^6.2.0
  test: ^1.33.0
  twk_test:
    path: ../twk_test
