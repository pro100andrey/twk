# Data-driven fixes for twk: what `dart fix --apply` (and the IDE's quick
# fixes) change in an app written against an older twk.
#
# The format: https://dart.dev/go/data-driven-fixes (version 1). Newest
# first, each with the commit that made the change. Every transform is
# tested by a case in test_fixes/, checked by
# `dart fix --compare-to-golden test_fixes` in this package.
#
# Not here, because a fix runs on a diagnostic of a library that resolves
# and an import of a package the app no longer depends on resolves to
# nothing: the package renames (tui to twk, 826735a) and the packages that
# became libraries of twk (8a3e24c: package:twk_hooks/twk_hooks.dart is
# package:twk/hooks.dart, package:twk_provider/twk_provider.dart is
# package:twk/provider.dart, their names unchanged). Those imports are
# moved by hand first (doc/internals/quality/README.md, "Renames and
# moves"), then this file renames what they import.

version: 1
transforms:
  # 6d4f947 Rename the API's tui names to twk
  - title: "Rename to 'twkApp'"
    date: 2026-10-22
    element:
      uris: ['twk.dart']
      field: 'tuiApp'
      inClass: 'AppBinding'
    changes:
      - kind: 'rename'
        newName: 'twkApp'
