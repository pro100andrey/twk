# The template of `twk create --template=inline`: this package, packed by
# tool/pack_templates.dart into lib/src/templates/inline.g.dart, where `twk
# create` unpacks it under the new package's name. The pubspec's paths to
# twk, twk_dev and twk_test are rewritten by `twk create` as mold plans the
# unpack.
name: inline
version: 0.1.0

exclude:
  - mold.yaml
  - pubspec.lock

variables:
  package_name:
    description: The name of the new package.
    default: my_app
    replaces: inline_template
