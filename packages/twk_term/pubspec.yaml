name: twk_term
description: >-
  An embedded terminal for twk: a permissive VT emulator whose screen the
  core's Canvas draws, a pseudo-terminal through dart:ffi, and the
  TerminalView widget that runs a program in one.
version: 0.1.0
repository: https://github.com/pro100andrey/twk/tree/main/packages/twk_term
issue_tracker: https://github.com/pro100andrey/twk/issues
topics: [terminal, tui, emulator, pty, widgets]
# the pseudo-terminal is POSIX's (libc through dart:ffi); the emulator and
# TerminalView run anywhere
platforms:
  linux:
  macos:

environment:
  sdk: ^3.13.5
resolution: workspace
dependencies:
  twk: ^0.1.0
  twk_core: ^0.1.0
dev_dependencies:
  pro_lints: ^6.2.0
  test: ^1.33.0
  twk_test:
    path: ../twk_test
