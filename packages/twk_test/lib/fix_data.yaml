# Data-driven fixes for twk_test: what `dart fix --apply` (and the IDE's
# quick fixes) change in tests written against an older twk_test.
#
# The format: https://dart.dev/go/data-driven-fixes (version 1). Newest
# first, each with the commit that made the change. Every transform is
# tested by a case in test_fixes/, checked by
# `dart fix --compare-to-golden test_fixes` in this package.
#
# The package rename (tui_test to twk_test, 826735a) is not here: a fix
# runs on a diagnostic of a library that resolves, and an import of a
# package the tests no longer depend on resolves to nothing. That import
# is moved by hand first (doc/internals/quality/README.md, "Renames and moves"),
# then this file renames what it imports.

version: 1
transforms:
  # 6d4f947 Rename the API's tui names to twk
  - title: "Rename to 'TwkTester'"
    date: 2026-10-22
    element:
      uris: ['twk_test.dart']
      class: 'TuiTester'
    changes:
      - kind: 'rename'
        newName: 'TwkTester'

  - title: "Rename to 'testTwk'"
    date: 2026-10-22
    element:
      uris: ['twk_test.dart']
      function: 'testTui'
    changes:
      - kind: 'rename'
        newName: 'testTwk'
