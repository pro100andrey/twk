# PROBE, never merged: the three unproven cases of PR #7, many times under
# load, each failure printed whole (tm: ci-probe-flakes).
name: ci

on:
  pull_request:

jobs:
  macos-exit-code:
    # the window between spawn and watch made 50 ms wide: without the
    # suspended spawn the test should fail, with it pass
    strategy:
      fail-fast: false
      matrix:
        fix: ['0', '1']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - shell: bash
        working-directory: packages/twk_term
        env:
          PROBE_FIX: ${{ matrix.fix }}
        run: |
          fails=0
          for i in $(seq 1 10); do
            if ! dart test test/pty/pty_test.dart -N 'end at once' --reporter=failures-only > out.txt 2>&1; then
              fails=$((fails+1)); echo "== run $i failed"; head -c 2000 out.txt; echo
            fi
          done
          echo "macos exit-code test, fix=$PROBE_FIX: $fails of 10 failed"

  linux-pty-ctrlz:
    strategy:
      fail-fast: false
      matrix:
        noflsh: ['0', '1']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: uname -a; python3 -I tool/probe_flush.py
      - run: dart pub get
      - shell: bash
        env:
          PROBE_NOFLSH: ${{ matrix.noflsh }}
        run: |
          (dart run tool/xtask.dart ci-test -j auto > load.txt 2>&1 || true) &
          cd packages/twk_term
          one() {
            if ! timeout 120 dart test test/pty/pty_test.dart -N 'fg continues it' --reporter=failures-only > out.$1.txt 2>&1; then
              echo "== run $1 failed"; head -c 3000 out.$1.txt; echo
            fi
          }
          export -f one
          seq 1 100 | xargs -P 4 -I{} bash -c 'one {}' | tee fails.txt
          echo "linux pty ctrl+z, noflsh=$PROBE_NOFLSH: $(grep -c '^== run' fails.txt) of 100 failed"
          wait
