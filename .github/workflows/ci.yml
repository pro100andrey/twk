# PROBE, never merged: the three unproven cases of PR #7, many times under
# load, each failure printed whole (tm: ci-probe-flakes).
name: ci

on:
  pull_request:

jobs:
  macos-exit-code:
    # without POSIX_SPAWN_START_SUSPENDED (reverted on this branch): the
    # test of programs that end at once should fail
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - shell: bash
        working-directory: packages/twk_term
        run: |
          fails=0
          for i in $(seq 1 30); do
            if ! dart test test/pty/pty_test.dart -N 'end at once' --reporter=failures-only > out.txt 2>&1; then
              fails=$((fails+1)); echo "== run $i failed"; head -c 3000 out.txt; echo
            fi
          done
          echo "macos exit-code test without the fix: $fails of 30 failed"

  linux-pty-ctrlz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - shell: bash
        run: |
          (dart run tool/xtask.dart ci-test -j auto > load.txt 2>&1 || true) &
          cd packages/twk_term
          one() {
            if ! timeout 120 dart test test/pty/pty_test.dart -N 'fg continues it' --reporter=failures-only > out.$1.txt 2>&1; then
              echo "== run $1 failed"; head -c 4000 out.$1.txt; echo
            fi
          }
          export -f one
          seq 1 100 | xargs -P 4 -I{} bash -c 'one {}' | tee fails.txt
          echo "linux pty ctrl+z: $(grep -c '^== run' fails.txt) of 100 failed"
          wait

  windows-web-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: dart pub get
      - shell: bash
        run: |
          (cd packages/twk && dart test -j 4 > ../../load.txt 2>&1 || true) &
          fails=0
          for i in $(seq 1 20); do
            if ! dart run tool/web_check.dart twk > out.txt 2>&1; then
              fails=$((fails+1)); echo "== run $i failed"; cat out.txt; echo
            fi
          done
          echo "windows web_check twk: $fails of 20 failed"
          wait
