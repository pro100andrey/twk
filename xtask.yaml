# The repository's checks, run by xtask (a dev dependency; the entry point is
# tool/xtask.dart, the verbs it registers are in tool/xtask/):
#
#   dart run tool/xtask.dart quick        # pub get, analyze, format
#   dart run tool/xtask.dart handover     # what a handover or a pull request needs
#   dart run tool/xtask.dart bench        # the frame benchmark against HEAD
#   dart run tool/xtask.dart ci           # all of it, the benchmark last, alone
#   dart run tool/xtask.dart ci-os        # the published packages' tests, macOS, Windows
#   dart run tool/xtask.dart --list       # every task, by gate
#
# `entry:` below makes the installed xtask (`dart pub global activate xtask`)
# hand a run to tool/xtask.dart, so `xtask handover` is the same as these.
#
# --keep-going goes on past a failure to report every one; -j N runs N tasks,
# and the members of an each:, at once.
#
# Which changes need the benchmark is CONTRIBUTING.md's to say, in words: the file
# has no conditions. Heavy tasks run through the `spare`, `package` and
# `tests` verbs, which keep them off the benchmark's core and its SMT sibling
# (BENCH_CPU, 23 by default) where taskset and that core are there.
#
# --only narrows the per-package steps to some packages, the root's and the
# tools' packages' running all the same: every one of them goes over the `packages` set, whose
# members are the packages' pubspec.yaml files (quoted, or the shell reads
# the pattern):
#
#   dart run tool/xtask.dart handover --only 'packages=packages/twk/*'
#   dart run tool/xtask.dart handover --only 'packages=packages/{twk,twk_rich}/*'
version: 1
entry: tool/xtask.dart

# ci is the Linux job of .github/workflows/ci.yml; ci-os the macOS and
# Windows ones, over the packages that are published (the `published` set).
gates: [quick, handover, ci, ci-os]

sets:
  # Every package of the repository, by its pubspec.yaml: those under
  # packages/, and the templates `twk create` writes, packages of their own.
  # The `package` and `tests` verbs run in the package of the path they are
  # given. The one set the per-package steps go over, so that one --only
  # narrows them all.
  packages:
    include:
      - packages/*/pubspec.yaml
      - packages/twk_dev/templates/*/pubspec.yaml

  # The gallery's pages drawn from its golden screens
  # (packages/gallery/tool/shots.dart), which gallery-shots writes again.
  shots:
    include:
      - packages/gallery/doc/shots/**

  # The widget catalog (doc/widgets/), written from the gallery by
  # packages/gallery/tool/catalog.dart, which `catalog` writes again.
  catalog:
    include:
      - doc/widgets/**

  # The tools' own packages (the allocation profiler, the frame scenarios,
  # the docs and coverage tools). Not narrowed by --only packages.
  tools:
    include:
      - tool/*/pubspec.yaml

  # The packages that resolve by themselves: the templates, scaffolds of
  # apps of their own that `twk create` copies out of the repository, and
  # so no members of the pub workspace the root's pubspec.yaml lists, which
  # the rest are. Not narrowed by --only packages: a second each.
  templates:
    include:
      - packages/twk_dev/templates/*/pubspec.yaml

  # The packages published to pub.dev, and the tester their tests take:
  # what ci-os runs on macOS and Windows, where their terminal backends are
  # another's.
  published:
    include:
      - packages/twk_core/pubspec.yaml
      - packages/twk/pubspec.yaml
      - packages/twk_test/pubspec.yaml

  # The packages with data-driven fixes, by their test_fixes/.
  fix-tests:
    include:
      - packages/*/test_fixes/analysis_options.yaml

tasks:
  validate:
    desc: fail if this file is wrong (xtask --validate)
    gate: [quick, handover, ci, ci-os]
    run: [dart, run, tool/xtask.dart, --validate]

  workflows-check:
    # Each step of .github/workflows runs one gate of this file, nothing
    # beside it (`dart analyze` written into a workflow is refused), and a
    # gate or task no job reaches is named.
    desc: fail if a CI step runs anything but one gate of this file
    gate: [handover, ci]
    run: [dart, run, tool/xtask.dart, --check-ci]

  format:
    # The root's own Dart files: its tools and their tests. The packages',
    # the core's among them, are pkg-format's.
    desc: fail if a Dart file of the root's test/ or tool/ is unformatted
    gate: [quick, handover, ci]
    run:
      - dart
      - format
      - --output=none
      - --set-exit-if-changed
      - test
      - tool

  pkg-format:
    desc: fail if a Dart file of a package is unformatted
    gate: [quick, handover, ci]
    each: packages
    do: package
    args: [$each, dart, format, --output=none, --set-exit-if-changed, .]

  get:
    # The pub workspace's one resolution: every package under packages/
    # (the core among them) and the tools' packages, into the root's pubspec.lock and
    # .dart_tool/package_config.json, which the members find from their
    # directories. Not beside pkg-get: they share one ~/.pub-cache.
    desc: dart pub get at the root, for the whole pub workspace
    exclusive: [pub-cache]
    run: [dart, pub, get]

  pkg-get:
    # Each template's own resolution, one at a time; a second each when
    # nothing changed.
    desc: dart pub get in every template, outside the workspace
    each: templates
    exclusive: [pub-cache]
    do: package
    args: [$each, dart, pub, get]

  plugin:
    # twk_lints' plugin, built for the pub workspace before any analysis
    # server of it starts. A server builds the plugin into one directory per
    # context root (~/.dartServer/.plugin_manager/<md5 of the root's
    # path>/bin/plugin.aot), deleting the old snapshot and compiling the new
    # one in place, with no lock; and in the workspace the context root of
    # every member's analysis is the workspace's, the repository's root, so
    # the root's analyze, every package's and every tool's share that one
    # snapshot. Started at once after the plugin changed, they rebuild and
    # load that one file together, and the one loading it dies (SIGSEGV,
    # SIGBUS, "file too short"). This one analysis of one file of the
    # root's builds it alone (some 25 s after a change, a second or two
    # when it is fresh), and the others only load it. The file is the
    # root's: one of a member's, analyzed by itself, can get that member's
    # directory as its context root (packages/twk_lints/lib/main.dart
    # did), and build a snapshot no other analysis loads. The templates are
    # packages of their own, outside the workspace, each with its own.
    desc: build twk_lints' plugin for the workspace, before the analyses
    needs: [get]
    do: spare
    args: [dart, analyze, tool/xtask.dart]

  analyze:
    # The root's analyze covers the packages too; --fatal-infos because
    # pro_lints says most of what it says as infos. The templates it
    # excludes (analysis_options.yaml), packages of their own.
    desc: refuse anything the analyzer or the lints object to, everywhere
    gate: [quick, handover, ci]
    needs: [get, plugin]
    do: spare
    args: [dart, analyze, --fatal-infos]

  pkg-analyze:
    desc: dart analyze --fatal-infos in every package
    gate: [handover, ci]
    needs: [get, pkg-get, plugin]
    each: packages
    do: package
    args: [$each, dart, analyze, --fatal-infos]

  tool-analyze:
    # The root's analyze covers the tools' packages too, but its run of the
    # twk_lints plugin over the other packages' contexts is not complete
    # (it left out findings that a package's own analyze reports, and not
    # the same ones twice): each package's own analyze is what enforces
    # the plugin, as pkg-analyze does for the packages.
    desc: dart analyze --fatal-infos in every tool's package
    gate: [handover, ci]
    needs: [get, plugin]
    each: tools
    do: package
    args: [$each, dart, analyze, --fatal-infos]

  pkg-fix-data:
    desc: each package's data-driven fixes against its test_fixes/, the core's too
    gate: [handover, ci]
    needs: [get, plugin]
    each: fix-tests
    do: package
    args: [$each, dart, fix, --compare-to-golden, test_fixes]

  test:
    # The root's own suite, test/tool/: the checks of this file and the
    # verbs of tool/xtask/, and tool/web_check.dart's core case. Under -j it,
    # the coverage run and the end to end runs go one at a time
    # (`exclusive: [tests]`), the packages' suites beside them.
    desc: the root's tests, of its tools
    gate: [handover, ci]
    exclusive: [tests]
    do: spare
    args: [dart, test, --reporter=failures-only]

  pkg-test:
    # Under -j the packages' suites run at once, the core's among them,
    # beside the root's: three of them take most of the time (twk_dev's,
    # which compiles and starts apps, twk's and the core's), the others
    # seconds each.
    desc: the tests of every package that has a test/
    gate: [handover, ci]
    needs: [get, pkg-get]
    each: packages
    do: tests
    args: [$each, --reporter=failures-only]

  os-test:
    # pkg-test's, over the published packages only: ci-os, on macOS and
    # Windows.
    desc: the tests of the published packages and their tester
    gate: [ci-os]
    needs: [get]
    each: published
    do: tests
    args: [$each, --reporter=failures-only]

  tool-test:
    desc: the tests of the tools' packages that have a test/
    gate: [handover, ci]
    needs: [get]
    each: tools
    do: tests
    args: [$each, --reporter=failures-only]

  doc-snippets:
    # Each ```dart block of a `///` comment in lib/, of the core and of
    # every package, written to a file of its own that sees its package's
    # public libraries, and analyzed; an issue is reported at the doc
    # comment's line. The conventions (`dart-nocheck`, `// Examples can
    # assume:`) are doc/internals/quality/README.md's. It reads each package's
    # resolution, which get and pkg-get write.
    desc: analyze the dart examples of every doc comment, in its package
    gate: [handover, ci]
    needs: [get, pkg-get]
    do: spare
    args: [dart, run, tool/doc_snippets/bin/doc_snippets.dart]

  undocumented:
    # Not in a gate: it writes reports, the input of the docs work. Package
    # names after `--` write theirs only.
    desc: >-
      write doc/internals/quality/undocumented/, the public members with no
      docs
    needs: [get, pkg-get]
    do: spare
    args: [dart, run, tool/doc_snippets/bin/undocumented.dart]

  coverage:
    # Not in a gate: it runs every suite again with coverage, minutes. It
    # writes the reports even when a suite fails, and fails then. Package
    # names after `--` measure those only (--only narrows its pub get, not
    # what it measures).
    desc: >-
      write doc/internals/quality/coverage/, what the tests of each package
      miss
    needs: [get, pkg-get]
    exclusive: [tests]
    do: spare
    args: [dart, run, tool/coverage/bin/coverage.dart]

  browser-test:
    # In ci, not handover: it needs Chrome, and the network (the tests load
    # xterm.js from jsDelivr). Skipped, and said so, where there is no
    # Chrome (CHROME_EXECUTABLE, or google-chrome-stable, google-chrome,
    # chromium on the PATH).
    desc: twk_web's tests in Chrome (dart2wasm); skipped without Chrome
    gate: [ci]
    needs: [get]
    exclusive: [tests]
    do: browser
    args: [packages/twk_web, test/browser/]

  pub-check:
    # In ci, not handover: pana needs the network and takes minutes (it
    # documents the package with dartdoc). The packages to be published:
    # publish_to, `dart pub publish --dry-run`'s errors (its warnings
    # shown), and pana's score out of 160 with what lost points; `--min=N`
    # fails a score under N. pana is `dart pub global activate pana`'s,
    # skipped and said so without it.
    desc: whether twk_core, twk and twk_test are ready for pub.dev, pana scoring them
    gate: [ci]
    needs: [get]
    do: pub
    # pana's 160 of 160, which twk_core has: what loses a point fails.
    args: [--min=160, packages/twk_core, packages/twk, packages/twk_test]

  # The packages published to pub.dev, in no gate: an upload is not taken
  # back. Each after pub-check, and after the one it takes from the
  # registry (twk takes twk_core by version, twk_test both): pub.dev
  # resolves it there. `dart pub login` first; publish-test publishes all
  # three in order.
  publish-core:
    desc: publish twk_core to pub.dev, once pub-check passes
    needs: [pub-check]
    do: publish
    args: [packages/twk_core]

  publish-twk:
    desc: publish twk to pub.dev, after twk_core
    needs: [publish-core]
    do: publish
    args: [packages/twk]

  publish-test:
    desc: publish twk_test to pub.dev, after twk
    needs: [publish-twk]
    do: publish
    args: [packages/twk_test]

  gallery-shots:
    # The gallery's pages as SVGs (packages/gallery/doc/shots/), drawn from
    # its golden screens alone: written again, and failed where that
    # changed a file, so that they are committed with the goldens.
    desc: draw the gallery's golden screens as SVGs; fail if they were stale
    gate: [handover, ci]
    needs: [get]
    unchanged: shots
    do: package
    args: [packages/gallery, dart, run, tool/shots.dart]

  catalog:
    # The widget catalog, doc/widgets/: a page a group and a page a widget,
    # written from the gallery's catalog, pages and pictures (its
    # gallery-shots). Written again, and failed where that changed a file.
    desc: write the widget catalog from the gallery; fail if it was stale
    gate: [handover, ci]
    needs: [gallery-shots]
    unchanged: catalog
    do: package
    args: [packages/gallery, dart, run, tool/catalog.dart]

  gallery-code:
    # Each page of the gallery: its Code tab made into a program, run in
    # twk's tester at the stage's room, theme and time, its cells against
    # the stage's (packages/gallery/README.md, "The Code against the
    # stage"). Some twenty seconds; it builds a package of the Codes in
    # packages/gallery/.dart_tool/code_check/.
    desc: hold each gallery page's Code tab to what its stage shows
    gate: [handover, ci]
    needs: [get]
    do: package
    args: [packages/gallery, dart, run, tool/code_check.dart]

  vscode-install:
    # The VS Code extension's (editors/vscode) checks run in a copy of it,
    # .dart_tool/vscode/, never in editors/vscode: the extension is run
    # from its out/, its webview loading @xterm from its node_modules, and
    # an npm ci there deletes that node_modules before it writes the new
    # one. npm ci there once per package.json and package-lock.json (the
    # network on the first, unless npm's cache has them). Each of the three
    # steps is skipped, and said so, where node or npm is not on the PATH.
    desc: npm ci for the VS Code extension, in .dart_tool/vscode/, once per lock
    gate: [handover, ci]
    do: vscode
    args: [install]

  vscode-compile:
    # editors/vscode/src and its tsconfigs copied afresh, then its
    # `npm run compile` (tsc, both projects): a type error fails.
    desc: compile the VS Code extension (tsc) into .dart_tool/vscode/out/
    gate: [handover, ci]
    needs: [vscode-install]
    do: vscode
    args: [compile]

  vscode-unit:
    # Its unit tests, core/ and app/ under node (npm run test:unit's mocha,
    # over what vscode-compile wrote, not compiling again); among them
    # wire_golden.test.ts, the extension's half of
    # packages/twk_core/test/terminal/shell_wire.golden.json. The suite in
    # a real VS Code (npm test) is in no gate: it needs a display and
    # downloads a VS Code.
    desc: the VS Code extension's unit tests (mocha), over that compile
    gate: [handover, ci]
    needs: [vscode-compile]
    do: vscode
    args: [unit]

  e2e-fullscreen:
    # pty_run.py takes Python's pty, which Windows has not.
    desc: the chat demo in a pseudo-terminal, its output through the emulator
    gate: [handover, ci]
    platforms: [linux, macos]
    exclusive: [tests]
    do: e2e
    args: [fullscreen]

  e2e-inline:
    desc: the same in the inline mode
    gate: [handover, ci]
    platforms: [linux, macos]
    exclusive: [tests]
    do: e2e
    args: [inline]

  bench:
    # Not in a gate: CONTRIBUTING.md says when it is owed. BENCH_BASELINE names
    # the commit the work started from (HEAD unless set); arguments after
    # `--` go to tool/bench.dart (`-- --baseline=REV --only=wrap`).
    desc: frame benchmark against HEAD, locked and pinned; fails on more bytes
    platforms: [linux]
    do: bench

  bench-last:
    # The benchmark of `ci`. `alone`: under -j nothing else runs while it
    # does, as a benchmark beside a test run measures the test run. Alone
    # does not order: without needs it would run as soon as it is ready,
    # after the first few tasks and before the rest. Its needs, the rest of
    # the gate, keep it last, so that a red check ends the run before the
    # benchmark's minutes are spent; a task added to ci and not here runs
    # before or after it, never beside it.
    desc: the frame benchmark, alone, after every other check of ci
    gate: [ci]
    alone: true
    platforms: [linux]
    needs:
      - validate
      - workflows-check
      - format
      - pkg-format
      - get
      - pkg-get
      - plugin
      - analyze
      - pkg-analyze
      - tool-analyze
      - pkg-fix-data
      - test
      - pkg-test
      - tool-test
      - doc-snippets
      - gallery-code
      - pub-check
      - browser-test
      - vscode-install
      - vscode-compile
      - vscode-unit
      - e2e-fullscreen
      - e2e-inline
    do: bench
